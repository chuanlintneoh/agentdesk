services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentdesk-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - agentdesk-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agentdesk-frontend
    restart: unless-stopped
    profiles: ["nextjs", "all"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentdesk-net

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: agentdesk-dashboard
    restart: unless-stopped
    profiles: ["streamlit", "all"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentdesk-net

networks:
  agentdesk-net:
    driver: bridge
